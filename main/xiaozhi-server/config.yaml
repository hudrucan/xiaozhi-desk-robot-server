# Keep this file as a safe reference configuration with placeholders or generic
# defaults only. Put the active local provider choices, models, endpoints, and
# secrets in data/.config.yaml; values there override this file.

# #####################################################################################
# ############################ Basic server configuration ############################
server:
  # Server listen address and WebSocket port.
  ip: 0.0.0.0
  port: 8000
  # HTTP port for the standalone OTA and vision endpoints.
  http_port: 8003
  # WebSocket URL returned to the device by the OTA endpoint.
  # Replace this generic local URL in data/.config.yaml with the address reachable
  # by the device.
  websocket: ws://127.0.0.1:8000/xiaozhi/v1/
  # Vision endpoint URL sent to the device.
  # Replace this generic local URL in data/.config.yaml with the address reachable
  # by the device.
  vision_explain: http://127.0.0.1:8003/mcp/vision/explain
  # Timezone offset returned by OTA.
  timezone_offset: +8
  # Authentication settings.
  auth:
    # Enable token authentication.
    enabled: false
    # Devices in this allowlist bypass token validation.
    allowed_devices:
      - "11:22:33:44:55:66"
  # Optional MQTT gateway advertised through OTA, formatted as host:port.
  mqtt_gateway: null
  # Optional signing key used to generate MQTT connection passwords.
  mqtt_signature_key: null
  # Optional UDP gateway advertised through OTA.
  udp_gateway: null
log:
  # Console log format.
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # File log format.
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Supported levels include INFO and DEBUG.
  log_level: INFO
  # Log directory.
  log_dir: tmp
  # Log filename.
  log_file: "server.log"
  # Runtime data directory.
  data_dir: data

# Delete generated audio files after use.
delete_audio: true
# Disconnect after this many seconds without voice input.
close_connection_no_voice_time: 120
# TTS request timeout in seconds.
tts_timeout: 15
# Tool-call timeout in seconds.
tool_call_timeout: 30
# Cache wake-word responses to reduce startup response latency.
enable_wakeup_words_response_cache: true
# Respond when a wake word starts a conversation.
enable_greeting: true
# Generic greeting passed to the LLM after wake-word detection.
wakeup_greeting: "Hello"
# Play a notification sound after speech finishes.
enable_stop_tts_notify: false
# Notification sound path.
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Enable WebSocket ping keepalive.
enable_websocket_ping: false


# Delay between outgoing TTS audio packets.
#   0: derive precise pacing from the audio frame rate.
#   > 0: use a fixed delay in milliseconds, for example 60.
tts_audio_send_delay: 0

exit_commands:
  - "exit"
  - "quit"

# Fixed spoken response returned by the exit tool.
exit_farewell: "Goodbye, see you next time!"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus supports 8000, 12000, 16000, 24000, and 48000 Hz.
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Example sentences for manual module checks.
module_test:
  test_sentences:
    - "Hello, please introduce yourself."
    - "What's the weather like today?"
    - "Summarize the principles and applications of quantum computing."

# Wake words used to distinguish activation from regular speech.
wakeup_words:
  - "Hello Xiaozhi"
  - "Hey Xiaozhi"
# Optional external MCP endpoint. Expected format:
# ws://host:port/mcp/?token=token
mcp_endpoint: null

# Optional context sources injected into the system prompt.
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Server plugin configuration.
plugins:
  get_weather:
    # QWeather API credentials. The tool is not registered while these are empty.
    api_host: ""
    api_key: ""
    default_location: ""
  web_search:
    # Supported providers: metaso, tavily. The tool is not registered without a valid key.
    provider: ""
    description: "Search the web when the user explicitly asks for current online information."
    max_results: 5
    api_key: ""
# Optional voiceprint recognition configuration.
voiceprint:
  # Voiceprint service endpoint.
  url:
  # Entries use speaker_id,name,description.
  speakers:
    - "test1,Alice,Alice is a software engineer"
    - "test2,Bob,Bob is a product manager"
    - "test3,Carol,Carol is a designer"
  # Similarity threshold from 0.0 to 1.0. Higher values are stricter.
  similarity_threshold: 0.4

# #####################################################################################
# ############################ Assistant configuration ###############################

prompt: |
  You are a helpful voice assistant. Respond clearly and concisely in the
  user's language.

# Default system-prompt template file.
prompt_template: agent-base-prompt.txt

# User-facing response for internal errors.
system_error_response: "Sorry, I am temporarily unavailable. Please try again shortly."

# Optional conversation-closing prompt.
end_prompt:
  enable: true
  prompt: |
    End the conversation briefly and politely in the user's language.

# Active provider selection. Override local choices in data/.config.yaml.
selected_module:
  VAD: SileroVAD
  ASR: OpenAIASR
  LLM: OpenAILLM
  VLLM: OpenAIVLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: function_call

# Intent recognition providers and enabled server tools.
Intent:
  nointent:
    type: nointent
  intent_llm:
    type: intent_llm
    llm: GeminiLLM
    functions:
      - web_search
      - get_weather
  function_call:
    type: function_call
    functions:
      - web_search
      - get_weather

Memory:
  mem0ai:
    type: mem0ai
    api_key: your_mem0_api_key
  nomem:
    type: nomem
  mem_local_short:
    type: mem_local_short
    llm: GeminiLLM

ASR:
  GeminiASR:
    type: gemini
    model_name: your_gemini_asr_model
    api_key: your_api_key
    language: auto
    mode: verbatim
    timeout: 120
    output_dir: tmp/
  OpenAIASR:
    type: openai
    api_key: your_api_key
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/

VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 200  # Increase this for longer pauses within speech.

LLM:
  GeminiLLM:
    type: gemini
    api_key: your_api_key
    model_name: your_gemini_model
    timeout: 120
    http_proxy: ""
    https_proxy: ""
  OpenAILLM:
    type: openai
    api_key: your_api_key
    base_url: https://api.openai.com/v1
    model_name: gpt-4o-mini
    timeout:
      pool: 2
      connect: 3
      write: 5
      read: 60

# Vision-language provider using an OpenAI-compatible API.
VLLM:
  GeminiVLLM:
    # Gemini vision through its OpenAI-compatible endpoint.
    type: openai
    api_key: your_api_key
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model_name: your_gemini_vision_model
  OpenAIVLLM:
    type: openai
    api_key: your_api_key
    base_url: https://api.openai.com/v1
    model_name: gpt-4o-mini

TTS:
  GeminiTTS:
    type: gemini
    model_name: your_gemini_tts_model
    api_key: your_api_key
    voice: your_gemini_voice
    language: your_language
    max_retries: 2
    min_segment_chars: 80
    output_dir: tmp/
  EdgeTTS:
    type: edge
    voice: your_edge_voice
    language: your_language
    # Retry once after the initial request fails.
    max_retries: 1
    output_dir: tmp/
  OpenAITTS:
    type: openai
    api_key: your_api_key
    api_url: https://api.openai.com/v1/audio/speech
    model: tts-1
    voice: alloy
    speed: 1
    format: mp3
    output_dir: tmp/
  CustomTTS:
    # The endpoint must accept the configured request and return audio bytes.
    type: custom
    method: POST
    url: "http://127.0.0.1:8880/v1/audio/speech"
    params:
      input: "{prompt_text}"
      response_format: "mp3"
      voice: "alloy"
      speed: 1
    headers: {}
    format: mp3
    output_dir: tmp/
