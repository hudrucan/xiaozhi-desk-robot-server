# Keep this file as a safe reference configuration with placeholders or generic
# defaults only. Put the active local provider choices, models, endpoints, and
# secrets in data/.config.yaml; values there override this file.

# #####################################################################################
# ############################ Basic server configuration ############################
server:
  # Server listen address and WebSocket port.
  ip: 0.0.0.0
  port: 8000
  # HTTP port for the standalone OTA and vision endpoints.
  http_port: 8003
  # Lightweight local settings UI served by the existing HTTP server.
  settings:
    enabled: true
    # Keep configuration writes on this machine unless LAN access is explicit.
    allow_remote: false
  # WebSocket URL returned to the device by the OTA endpoint.
  # Replace this generic local URL in data/.config.yaml with the address reachable
  # by the device.
  websocket: ws://127.0.0.1:8000/xiaozhi/v1/
  # Vision endpoint URL sent to the device.
  # Replace this generic local URL in data/.config.yaml with the address reachable
  # by the device.
  vision_explain: http://127.0.0.1:8003/mcp/vision/explain
  # Timezone offset returned by OTA.
  timezone_offset: +8
  # Authentication settings.
  auth:
    # Enable token authentication.
    enabled: false
    # Devices in this allowlist bypass token validation.
    allowed_devices:
      - "11:22:33:44:55:66"
  # Optional MQTT gateway advertised through OTA, formatted as host:port.
  mqtt_gateway: null
  # Optional signing key used to generate MQTT connection passwords.
  mqtt_signature_key: null
  # Optional UDP gateway advertised through OTA.
  udp_gateway: null
log:
  # Console log format.
  log_format: "<green>{time:YYMMDD HH:mm:ss}</green>[{version}_{selected_module}][<light-blue>{extra[tag]}</light-blue>]-<level>{level}</level>-<light-green>{message}</light-green>"
  # File log format.
  log_format_file: "{time:YYYY-MM-DD HH:mm:ss} - {version}_{selected_module} - {name} - {level} - {extra[tag]} - {message}"
  # Supported levels include INFO and DEBUG.
  log_level: INFO
  # Log directory.
  log_dir: tmp
  # Log filename.
  log_file: "server.log"
  # Runtime data directory.
  data_dir: data

# Delete generated audio files after use.
delete_audio: true
# Disconnect after this many seconds without voice input.
close_connection_no_voice_time: 120
# TTS request timeout in seconds.
tts_timeout: 15
# Tool-call timeout in seconds.
tool_call_timeout: 30
# Keep the virtual direct-answer tool configurable for latency A/B comparisons.
enable_direct_answer_tool: true

# Cache the single Desk Robot's MCP schemas only while llama.cpp is selected, so
# it can prefill them before accepting a connection. Cloud LLMs always use the
# live firmware inventory. Runtime updates stay under data/ and are not committed.
device_mcp_tool_cache:
  enabled: true
  prewarm: true
  seed_path: config/device_mcp_tools.json
  path: data/.device_mcp_tools.json

# Emit one structured timing summary after each turn.
enable_turn_metrics: true
# Dump canonical messages and tool schemas as one JSON object per line.
# This may contain private conversation and tool data, so keep it disabled by default.
dump_full_llm_request: false
llm_request_dump_file: tmp/llm_requests.jsonl
# Ignore only extremely short audio bursts before invoking non-streaming ASR.
asr_min_audio_ms: 300
# Bound decoded input audio to about twelve seconds of 60 ms frames.
asr_audio_queue_max_frames: 200
# Cache wake-word responses to reduce startup response latency.
enable_wakeup_words_response_cache: true
# Respond when a wake word starts a conversation.
enable_greeting: true
# Short acknowledgement requested from the LLM after wake-word detection.
wakeup_greeting: "Hello"
# Play a notification sound after speech finishes.
enable_stop_tts_notify: false
# Notification sound path.
stop_tts_notify_voice: "config/assets/tts_notify.mp3"
# Enable WebSocket ping keepalive.
enable_websocket_ping: false

# Delay between outgoing TTS audio packets.
#   0: derive precise pacing from the audio frame rate.
#   > 0: use a fixed delay in milliseconds, for example 60.
tts_audio_send_delay: 0

exit_commands:
  - "exit"
  - "quit"

# Fixed spoken response returned by the exit tool.
exit_farewell: "Goodbye, see you next time!"

xiaozhi:
  type: hello
  version: 1
  transport: websocket
  audio_params:
    format: opus
    # Opus supports 8000, 12000, 16000, 24000, and 48000 Hz.
    sample_rate: 24000
    channels: 1
    frame_duration: 60

# Example sentences for manual module checks.
module_test:
  tts_text: "This is a speech synthesis latency test."
  # Set a path relative to the repository root, or use PERF_VLLM_IMAGE.
  vllm_image: "docs/images/demo.jpg"
  vllm_question: "Describe this image briefly."
  test_sentences:
    - "Hello, please introduce yourself."
    - "Explain why leaves look green in two short sentences."
    - "Give me three practical ways to stay focused."
    - "What is 17 multiplied by 23?"
    - "Summarize why sleep is important."
    - "Tell me a short joke."
    - "Briefly compare tea and coffee."
    - "Describe a calm evening scene in one sentence."
  # Search-only prompts used by the web_search benchmark.
  web_search_queries:
    - "What are today's major technology news stories?"
    - "What is the current weather in Ho Chi Minh City?"
    - "What is the latest USD to VND exchange rate?"
  weather_locations:
    - "Ho Chi Minh City"
    - "Hanoi"
    - "Da Nang"
  air_quality_locations:
    - "Ho Chi Minh City"
    - "Hanoi"
    - "Da Nang"

# Wake words used to distinguish activation from regular speech.
wakeup_words:
  - "Hello Xiaozhi"
  - "Hey Xiaozhi"
# Optional external MCP endpoint. Expected format:
# ws://host:port/mcp/?token=token
mcp_endpoint: null

# Optional context sources injected into the system prompt.
context_providers:
  - url: ""
    headers:
      Authorization: ""

# Server plugin configuration.
plugins:
  get_air_quality:
    # Supported providers: open_meteo. Leave empty to disable the tool.
    provider: ""
    description: "Get current air quality, particle pollution, UV index, and a short forecast for a requested location."
    default_location: ""
    language: en
    preferred_country_code: ""
    forecast_hours: 24
    cache_ttl_seconds: 1800
  get_weather:
    # Supported providers: open_meteo. Leave empty to disable the tool.
    provider: ""
    description: "Get current conditions and a forecast for a requested location."
    # For a single local robot, this is the deterministic home location.
    default_location: ""
    # ISO 639-1 language for localized place names, with English as the default.
    language: en
    # Prefer this ISO 3166-1 alpha-2 country when multiple locations match.
    preferred_country_code: ""
    forecast_days: 7
    cache_ttl_seconds: 1800
  web_search:
    # Supported providers: metaso, tavily. The tool is not registered without a valid key.
    provider: ""
    description: "Search the web when the user explicitly asks for current online information."
    max_results: 5
    api_key: ""
    # Tavily-specific options. Leave country/language empty for automatic selection.
    search_depth: advanced
    include_answer: advanced
    country: ""
    language: ""
# Optional voiceprint recognition configuration.
voiceprint:
  # Voiceprint service endpoint.
  url:
  # Entries use speaker_id,name,description.
  speakers:
    - "test1,Alice,Alice is a software engineer"
    - "test2,Bob,Bob is a product manager"
    - "test3,Carol,Carol is a designer"
  # Similarity threshold from 0.0 to 1.0. Higher values are stricter.
  similarity_threshold: 0.4

# #####################################################################################
# ############################ Assistant configuration ###############################

prompt: |
  You are a helpful voice assistant. Respond clearly and concisely in the
  user's language.
  Write natural-language tool arguments in the user's language.

# Default system-prompt template file.
prompt_template: agent-base-prompt.txt

# User-facing response for internal errors.
system_error_response: "Sorry, I am temporarily unavailable. Please try again shortly."

# Optional conversation-closing prompt.
end_prompt:
  enable: true
  prompt: |
    End the conversation briefly and politely in the user's language.

# Active provider selection. Override local choices in data/.config.yaml.
selected_module:
  VAD: SileroVAD
  ASR: OpenAIASR
  LLM: OpenAILLM
  VLLM: OpenAIVLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: function_call

# Intent recognition providers and enabled server tools.
Intent:
  nointent:
    type: nointent
  intent_llm:
    type: intent_llm
    llm: GeminiLLM
    functions:
      - web_search
      - get_weather
      - get_air_quality
  function_call:
    type: function_call
    functions:
      - web_search
      - get_weather
      - get_air_quality

Memory:
  nomem:
    type: nomem
  mem_local_short:
    type: mem_local_short
    llm: GeminiLLM
  mem_local_explicit:
    type: mem_local_explicit
    path: data/.memory.yaml
    max_entries: 200
    entry_max_chars: 300
    recall_enabled: true
    recall_max_chars: 2000
    inject_max_chars: 1200
    # Override this list in data/.config.yaml for the deployment language.
    recall_stop_words:
      - about
      - and
      - is
      - memory
      - remember
      - the
      - what
      - who
    responses:
      remembered: I will remember that.
      forgotten: I forgot that.
      not_found: I could not find a matching memory.
      empty: I do not have any saved memories yet.
      recall_disabled: Memory recall is disabled.
      unavailable: Local memory is not enabled.
      missing_content: No memory content was provided.
      unsupported_action: Unsupported memory action.

ASR:
  GeminiASR:
    type: gemini
    model_name: gemini-3.5-transcribe-live
    api_key: your_api_key
    language: auto
    mode: VERBATIM
    # Refresh before the Live API's 10-minute session limit.
    session_refresh_seconds: 540
    # Buffer up to roughly 12 seconds of 120 ms audio chunks.
    audio_queue_size: 100
    chunk_ms: 120
  OpenAIASR:
    type: openai
    api_key: your_api_key
    base_url: https://api.openai.com/v1/audio/transcriptions
    model_name: gpt-4o-mini-transcribe
    output_dir: tmp/
  SherpaASR:
    type: sherpa
    model_dir: models/asr/sherpa/your-model
    encoder: encoder.int8.onnx
    decoder: decoder.onnx
    joiner: joiner.int8.onnx
    tokens: tokens.txt
    num_threads: 2
    sentence_case: true
    output_dir: tmp/

VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/vad
    min_silence_duration_ms: 200 # Increase this for longer pauses within speech.

LLM:
  GeminiLLM:
    type: gemini
    api_key: your_api_key
    model_name: your_gemini_model
    # Gemini 3 only. Uses managed Google Search while keeping web_search as a
    # custom-tool fallback for non-Gemini providers.
    native_google_search: false
    timeout: 120
    http_proxy: ""
    https_proxy: ""
  OpenAILLM:
    type: openai
    api_key: your_api_key
    base_url: https://api.openai.com/v1
    model_name: gpt-4o-mini
    timeout:
      pool: 2
      connect: 3
      write: 5
      read: 60
  LlamaCppLLM:
    type: llama_cpp
    api_key: local
    base_url: http://127.0.0.1:6000/v1
    model_name: qwen3:4b
    # Keep local voice responses stable while retaining some personality.
    temperature: 0.6
    top_p: 0.95
    # Bound recent context because tool schemas already consume a substantial
    # part of a local model's context window.
    max_history_messages: 8
    process:
      # When enabled, llama-server starts and stops with this application.
      managed: true
      executable: llama-server
      hf_model: Qwen/Qwen3-4B-GGUF:Q4_K_M
      # Use model_path instead of hf_model for an existing local GGUF file.
      # model_path: /absolute/path/to/model.gguf
      host: 127.0.0.1
      port: 6000
      context_size: 8192
      gpu_layers: all
      # This deployment serves one Desk Robot, so one slot maximizes prompt reuse.
      parallel: 1
      # Reuse unchanged tool-schema chunks when conversation history shifts.
      cache_reuse: 64
      # Reasoning is unnecessary for low-latency spoken turns.
      reasoning: "off"
      # The first start may also download the 4-bit model.
      startup_timeout: 900
      shutdown_timeout: 10
      log_file: tmp/llama-server.log
      # Set a positive value to unload the model from RAM while the server is idle.
      # sleep_idle_seconds: 900
      extra_args: []
    timeout:
      pool: 2
      connect: 3
      write: 5
      read: 120

# Vision-language provider using an OpenAI-compatible API.
VLLM:
  GeminiVLLM:
    # Gemini vision through its OpenAI-compatible endpoint.
    type: openai
    api_key: your_api_key
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    model_name: your_gemini_vision_model
    response_language: English
  OpenAIVLLM:
    type: openai
    api_key: your_api_key
    base_url: https://api.openai.com/v1
    model_name: gpt-4o-mini
    response_language: English
  LlamaCppVLLM:
    type: llama_cpp
    api_key: local
    base_url: http://127.0.0.1:6001/v1
    model_name: qwen2.5-vl:3b
    response_language: English
    max_tokens: 300
    temperature: 0.2
    top_p: 0.9
    process:
      # Keep the vision model unloaded until the first camera request.
      managed: true
      lazy_start: true
      executable: llama-server
      hf_model: ggml-org/Qwen2.5-VL-3B-Instruct-GGUF:Q4_K_M
      # Use model_path plus mmproj_path for existing local GGUF files.
      # model_path: /absolute/path/to/model.gguf
      # mmproj_path: /absolute/path/to/mmproj.gguf
      host: 127.0.0.1
      port: 6001
      context_size: 4096
      gpu_layers: all
      parallel: 1
      startup_timeout: 900
      shutdown_timeout: 10
      log_file: tmp/llama-vllm-server.log
      # Unload model resources after five idle minutes; the next vision request
      # wakes the server and reloads the model automatically.
      sleep_idle_seconds: 300
      extra_args: []

TTS:
  GeminiTTS:
    type: gemini
    model_name: your_gemini_tts_model
    api_key: your_api_key
    voice: your_gemini_voice
    language: your_language
    max_retries: 2
    min_segment_chars: 80
    output_dir: tmp/
  EdgeTTS:
    type: edge
    voice: your_edge_voice
    language: your_language
    # Generate the complete response in one request to avoid sentence gaps.
    buffer_full_response: true
    # Retry once after the initial request fails.
    max_retries: 1
    output_dir: tmp/
  SherpaTTS:
    type: sherpa
    language: your_language
    model_dir: models/tts/sherpa/your-model
    model: model.onnx
    tokens: tokens.txt
    data_dir: espeak-ng-data
    num_threads: 2
    speaker_id: 0
    number_language: your_language_code
    speed: 1.0
    silence_scale: 0.2
    volume_gain: 1.0
    buffer_full_response: false
    split_on_all_punctuations: true
    max_retries: 0
    output_dir: tmp/
  VieNeuTTS:
    # VieNeu v3 Nano runs locally with ONNX and downloads its model into the
    # Hugging Face cache on first use.
    type: vieneu
    language: your_language
    model_repo: pnnbao-ump/VieNeu-TTS-v3-Nano
    model_dir: ""
    hf_token: ""
    voice: Minh Quân
    threads: 0
    # Eight steps with negative sway is the fast Nano configuration.
    steps: 8
    cfg: 3.0
    sway: -1.0
    speed: 1.0
    seed:
    max_chars: 140
    # Emit the first TTS segment at a word boundary without waiting indefinitely
    # for model punctuation. Later segments still use punctuation boundaries.
    first_segment_chars: 32
    # Reuse the local inference engine after a device reconnects.
    keep_model_warm: true
    # Raise quieter speech toward a consistent loudness, then soft-limit peaks.
    mastering: true
    target_active_rms_dbfs: -10.0
    peak_ceiling_dbfs: -1.0
    # Applied after loudness normalization; values above 1 increase density.
    volume_gain: 1.0
    apply_watermark: false
    max_retries: 0
    output_dir: tmp/
  OpenAITTS:
    type: openai
    api_key: your_api_key
    api_url: https://api.openai.com/v1/audio/speech
    model: tts-1
    voice: alloy
    speed: 1
    format: mp3
    output_dir: tmp/
  CustomTTS:
    # The endpoint must accept the configured request and return audio bytes.
    type: custom
    method: POST
    url: "http://127.0.0.1:8880/v1/audio/speech"
    params:
      input: "{prompt_text}"
      response_format: "mp3"
      voice: "alloy"
      speed: 1
    headers: {}
    format: mp3
    output_dir: tmp/
