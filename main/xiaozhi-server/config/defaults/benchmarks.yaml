# Reference defaults: benchmarks.
# Put deployment-specific overrides and secrets in data/.config.yaml.

# Example sentences for manual module checks.
module_test:
  tts_text: "This is a speech synthesis latency test."
  # Set a path relative to the repository root, or use PERF_VLLM_IMAGE.
  vllm_image: "docs/images/demo.jpg"
  vllm_question: "Describe this image briefly."
  test_sentences:
    - "Hello, please introduce yourself."
    - "Explain why leaves look green in two short sentences."
    - "Give me three practical ways to stay focused."
    - "What is 17 multiplied by 23?"
    - "Summarize why sleep is important."
    - "Tell me a short joke."
    - "Briefly compare tea and coffee."
    - "Describe a calm evening scene in one sentence."
  # Search-only prompts used by the web_search benchmark.
  web_search_queries:
    - "What are today's major technology news stories?"
    - "What is the current weather in Ho Chi Minh City?"
    - "What is the latest USD to VND exchange rate?"
  weather_locations: {}
  air_quality_locations: {}
