# Reference defaults: providers / intent.
# Put deployment-specific overrides and secrets in data/.config.yaml.

# Intent recognition providers and enabled server tools.
Intent:
  nointent:
    type: nointent
  intent_llm:
    type: intent_llm
    llm: GeminiLLM
    functions:
      - get_current_datetime
      - web_search
      - get_weather
      - get_air_quality
  function_call:
    type: function_call
    functions:
      - get_current_datetime
      - web_search
      - get_weather
      - get_air_quality
