# Reference defaults: providers / memory.
# Put deployment-specific overrides and secrets in data/.config.yaml.

Memory:
  nomem:
    type: nomem
  mem_local_short:
    type: mem_local_short
    llm: GeminiLLM
  mem_local_explicit:
    type: mem_local_explicit
    path: data/.memory.yaml
    max_entries: 200
    entry_max_chars: 300
    recall_enabled: true
    # Pinned memories bypass retrieval; relevant memories still use score and top-K.
    pinned_max_chars: 1200
    recall_max_chars: 2000
    recall_top_k: 6
    recall_min_score: 2.5
    # Use the current message plus 2-3 recent turns to resolve project context.
    recall_recent_turns: 3
    recall_fuzzy_threshold: 0.84
    # Legacy fallback for deployments that have not set the two budgets above.
    inject_max_chars: 1200
    recall_aliases:
      cam: camera
      vl53: vl53l0x
      mpu: mpu6050
    # Override this list in data/.config.yaml for the deployment language.
    recall_stop_words:
      - about
      - and
      - is
      - memory
      - remember
      - the
      - what
      - who
    responses:
      remembered: I will remember that.
      forgotten: I forgot that.
      not_found: I could not find a matching memory.
      empty: I do not have any saved memories yet.
      recall_disabled: Memory recall is disabled.
      unavailable: Local memory is not enabled.
      missing_content: No memory content was provided.
      unsupported_action: Unsupported memory action.
